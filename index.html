<script>
  // DOM Elements
  const landing = document.getElementById('landing');
  const gallery = document.getElementById('gallery');
  const enterBtn = document.getElementById('enterBtn');

  // Enter Gallery Action
  enterBtn.addEventListener('click', () => {
    landing.classList.add('fade-out');
    setTimeout(() => { 
      landing.style.display = 'none'; 
      gallery.classList.add('visible'); 
      window.scrollTo({ top: 0, behavior: 'auto' }); // تم التعديل إلى auto لتوافق المتصفحات
    }, 950);
  });

  // Interactive Canvas Background
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  let width, height, particles;
  const particleCount = 60, lineDistance = 130, speed = 0.18;
  const pointer = { x: -1000, y: -1000, active: false };
  const pointerRadius = 120, pointerForce = 0.4;

  window.addEventListener('mousemove', (e) => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; });
  window.addEventListener('touchmove', (e) => { 
    if(e.touches.length > 0){ 
      pointer.x = e.touches[0].clientX; 
      pointer.y = e.touches[0].clientY; 
      pointer.active = true; 
    } 
  }, {passive: true});
  window.addEventListener('touchend', () => { pointer.active = false; });

  function resize(){ 
    width = canvas.width = window.innerWidth; 
    height = canvas.height = window.innerHeight; 
    initParticles(); // إعادة ضبط الجسيمات عند تغيير حجم الشاشة
  }
  
  function initParticles(){ 
    particles = Array.from({length: particleCount}, () => ({ 
      x: Math.random() * width, 
      y: Math.random() * height, 
      vx: (Math.random() - 0.5) * speed, 
      vy: (Math.random() - 0.5) * speed, 
      r: Math.random() * 1.6 + 0.6 
    })); 
  }

  window.addEventListener('resize', resize); 
  resize();

  function drawParticles(){
    ctx.clearRect(0, 0, width, height);
    
    particles.forEach(p => {
      p.x += p.vx; 
      p.y += p.vy;
      
      if(p.x < 0 || p.x > width) p.vx *= -1;
      if(p.y < 0 || p.y > height) p.vy *= -1;

      if(pointer.active){
        const dx = pointer.x - p.x, dy = pointer.y - p.y, dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < pointerRadius && dist > 0.01){ 
          const strength = (1 - dist / pointerRadius) * pointerForce; 
          p.x += (dx / dist) * strength * 4; 
          p.y += (dy / dist) * strength * 4; 
        }
      }

      ctx.beginPath(); 
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); 
      ctx.fillStyle = 'rgba(201,162,75,0.55)'; 
      ctx.fill();
    });

    for(let i = 0; i < particles.length; i++){
      for(let j = i + 1; j < particles.length; j++){
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < lineDistance){ 
          ctx.beginPath(); 
          ctx.moveTo(particles[i].x, particles[i].y); 
          ctx.lineTo(particles[j].x, particles[j].y); 
          ctx.strokeStyle = `rgba(28,110,106,${1 - dist / lineDistance})`; 
          ctx.lineWidth = 0.6; 
          ctx.stroke(); 
        }
      }
    }
    requestAnimationFrame(drawParticles);
  }
  drawParticles();

  // Scroll Reveal Observer
  const revealCards = document.querySelectorAll('.card');
  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if(entry.isIntersecting){
        const card = entry.target;
        card.classList.add('in-view');
        revealObserver.unobserve(card);
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -30px 0px' });

  revealCards.forEach(card => revealObserver.observe(card));
</script>
